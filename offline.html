<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F8F8">
  <title>ITSUPP — Σύνδεση στο Internet</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#F5F8F8;color:#1A2426;font:16px/1.6 system-ui,sans-serif}main{width:min(100%,400px)}img{width:80px;height:80px}h1{font-size:25px;line-height:1.25;margin:20px 0 12px}p{color:#4B5B5E}button{min-height:48px;width:100%;padding:12px 20px;border:0;border-radius:10px;background:#0E7C86;color:white;font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #C6931B;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#0E1516;color:#E7EEED}p{color:#9CACAB}button{background:#2FA9B3;color:#04211F}}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="ITSUPP" width="80" height="80">
    <h1>Χρειάζεται σύνδεση στο Internet</h1>
    <p>Το ITSUPP δεν μπορεί να συνδεθεί αυτή τη στιγμή. Έλεγξε το Wi-Fi ή τα δεδομένα κινητής και δοκίμασε ξανά.</p>
    <p>Για να δεις ή να αποθηκεύσεις στοιχεία πελατών και αιτημάτων, πρέπει να είσαι συνδεδεμένος στο Internet.</p>
    <button type="button" id="retry">Δοκιμή ξανά</button>
  </main>
  <script>document.getElementById('retry').addEventListener('click',()=>window.location.reload());</script>
</body>
</html>
